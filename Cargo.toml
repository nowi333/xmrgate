[package]
name = "xmrgate"
version = "0.1.0"
edition = "2021"
description = "Accept Monero with only a primary address and a private view key, without running a node"
license = "MIT"
repository = "https://github.com/nowi333/xmrgate"
readme = "README.md"
keywords = ["monero", "xmr", "payments", "woocommerce", "gateway"]
categories = ["cryptography::cryptocurrencies", "web-programming::http-server"]

[dependencies]
monero-wallet = "0.2.0"
zeroize = "1"
hex = "0.4"
thiserror = "2"
monero-daemon-rpc = "0.2.0"
async-trait = "0.1.92"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "socks", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rand = "0.8"
hmac = "0.13.0"
sha2 = "0.11.1"
futures = "0.3.34"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
argon2 = "0.5"

[dev-dependencies]
async-trait = "0.1.92"
axum = "0.8"
curve25519-dalek = "4"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = "0.12"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1.0.154"
tokio = "1.54.1"

[build-dependencies]
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
